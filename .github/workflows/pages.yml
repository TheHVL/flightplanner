name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install AIP chart text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Refresh Avinor AIP aerodrome data
        id: aip
        run: npm run aip:update
        continue-on-error: true

      - name: Report AIP refresh result
        if: always()
        run: |
          echo '### Avinor AIP refresh' >> "$GITHUB_STEP_SUMMARY"
          cat public/aip-status.json >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ steps.aip.outcome }}' != 'success' ]; then
            echo '::warning::AIP refresh failed. The site will display its previous snapshot with a visible freshness warning.'
          fi

      - name: Refresh published ATS radio areas
        id: frequencies
        run: npm run aip:frequencies
        continue-on-error: true

      - name: Report ATS refresh result
        if: always()
        run: |
          echo '### Published ATS frequency refresh' >> "$GITHUB_STEP_SUMMARY"
          cat public/aip-frequency-status.json >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ steps.frequencies.outcome }}' != 'success' ]; then
            echo '::warning::ATS refresh failed. Automatic channel suggestions will be withheld.'
          fi

      - name: Run unit tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Preserve the latest successful AIP snapshot and refresh status
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/aip-aerodromes.json public/aip-status.json public/aip-frequencies.json public/aip-frequency-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Avinor AIP snapshot and verification status [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
